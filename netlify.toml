[build]
  command = ""
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # AUTH_USER y COMPOSIO_USER_ID no son secretos: sus valores son palabras
  # comunes que aparecen en el código y provocan falsos positivos.
  SECRETS_SCAN_OMIT_KEYS = "AUTH_USER,COMPOSIO_USER_ID"

# Sin caché: los datos del usuario cambian en cada guardado y la
# aplicación tiene que pedir siempre el estado más reciente.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
