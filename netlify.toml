[build]
  command = ""
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # "tareas" y "default" son palabras normales que aparecen por todo el código
  # (el nombre de la app es "Tareas Aula Virtual" y `export default` está en
  # cada función). El escáner de secretos las confunde con secretos y tumba el
  # build, así que se excluyen por nombre. El resto de variables sí se escanea.
  SECRETS_SCAN_OMIT_KEYS = "AUTH_USER,COMPOSIO_USER_ID"

# Sin caché: los datos del usuario cambian en cada guardado y la
# aplicación tiene que pedir siempre el estado más reciente.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
